services:
  postgres:
    image: postgres:18
    container_name: tazama-postgres-1
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - 15432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
      - ./database/init/01-create-tables.sql:/docker-entrypoint-initdb.d/01-create-tables.sql

  valkey:
    image: valkey/valkey:7.2.5
    container_name: tazama-valkey-1
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - valkey_data:/data

  nats:
    image: nats:2
    container_name: tazama-nats-1
    restart: unless-stopped
    ports:
      - "14222:4222"
      - "16222:6222"
      - "18222:8222"
    command: ["--jetstream", "--http_port", "8222"]

  sftp:
    image: atmoz/sftp:latest
    container_name: tazama-sftp-1
    restart: unless-stopped
    ports:
      - "1222:22"
    volumes:
      - ./sftp/data:/home/foo/upload
    command: foo:pass:1001

  rule-studio-backend:
    container_name: rule-studio-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - valkey
      - nats
      - sftp

  rule-studio-frontend:
    container_name: rule-studio-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - rule-studio-backend

volumes:
  postgres_data:
  valkey_data: