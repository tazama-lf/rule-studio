services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql
      - ./_repo/core/postgres/migration/base:/docker-entrypoint-initdb.d
      - ./_repo/core/postgres/migration/config/00-public-base.sql:/docker-entrypoint-initdb.d/01-DATA.sql
      - ./_repo/core/postgres/migration/config/02-public-dockerhub.sql:/docker-entrypoint-initdb.d/02-DATA.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: unused
    ports:
      - "${PG_PORT:-15432}:5432"

  nats:
    image: nats:2
    restart: unless-stopped
    command: ["--jetstream", "-m", "8222", "-DVV"]
    ports:
      - "${NATS_PORT:-14222}:4222"
      - "${NATS_MONITOR_PORT:-18222}:8222"

  valkey:
    hostname: valkey
    image: valkey/valkey:7.2.5
    restart: unless-stopped
    command: "valkey-server --port 6379 --loglevel verbose"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 6379 ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    ports:
      - "${VALKEY_PORT:-16379}:6379"

  # ---------------------------------------------------------------------------
  # RULE PROCESSOR  (rule executor + rule logic)
  # ---------------------------------------------------------------------------
  rule-processor:
    image: tazamaorg/${RULE_IMAGE:-rule-901}:${TAZAMA_VERSION:-rc}
    env_file:
      - env/rule.env
    environment:
      - FUNCTION_NAME=${RULE_FUNCTION_NAME:-rule-901-rel-1-0-0}
      - RULE_VERSION=${RULE_VERSION:-rc}
      - RULE_NAME=${RULE_NAME:-901}
      - APM_SERVICE_NAME=rule-${RULE_NAME:-901}
      - CONFIGURATION_DATABASE_USER=postgres
      - CONFIGURATION_DATABASE_PASSWORD=unused
      - EVENT_HISTORY_DATABASE_USER=postgres
      - EVENT_HISTORY_DATABASE_PASSWORD=unused
      - RAW_HISTORY_DATABASE_USER=postgres
      - RAW_HISTORY_DATABASE_PASSWORD=unused
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_started
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  # ---------------------------------------------------------------------------
  # NATS UTILITIES  (REST proxy to hit the rule via NATS)
  # ---------------------------------------------------------------------------
  nats-utilities:
    image: tazamaorg/nats-utilities:${NATS_UTILS_VERSION:-latest}
    env_file:
      - env/nats-utilities.env  
    volumes:
      - ./proto/Full.proto:/home/app/node_modules/@tazama-lf/frms-coe-lib/lib/helpers/proto/Full.proto:ro
    restart: unless-stopped
    depends_on:
      - nats
    ports:
      - "${NATS_UTILS_PORT:-4000}:4000"

volumes:
  pg-data:
